name: Comprobar stock Tesla España

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesla-stock-es-v7
  cancel-in-progress: false

env:
  MAX_BROWSER_ATTEMPTS: "3"
  MONITOR_RELAY_URL: https://tesla-stock-es.clementmoreno.workers.dev/report
  PYTHONUNBUFFERED: "1"

jobs:
  attempt_linux:
    name: Intento principal — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      success: ${{ steps.monitor.outcome == 'success' }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Fijar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Espera aleatoria antipatrones
        if: github.event_name == 'schedule'
        run: |
          delay=$((45 + RANDOM % 136))
          echo "Esperando ${delay} segundos antes de abrir Tesla."
          sleep "${delay}"

      - name: Preparar Python
        run: |
          python3 --version
          python3 -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          google-chrome --version

      - id: monitor
        name: Consultar Tesla y actualizar Telegram
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: xvfb-run -a .venv/bin/python monitor.py

  fallback_macos:
    name: Respaldo — macOS
    needs: attempt_linux
    if: ${{ always() && needs.attempt_linux.outputs.success != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Fijar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preparar Python
        run: |
          python3 --version
          python3 -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Consultar Tesla y actualizar Telegram
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: .venv/bin/python monitor.py
