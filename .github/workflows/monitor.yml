name: Comprobar stock Tesla España

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesla-stock-es
  cancel-in-progress: false

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código
        run: git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .

      - name: Preparar Python
        run: |
          python3 --version
          python3 -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          google-chrome --version

      - name: Consultar Tesla y actualizar Telegram
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
          MONITOR_RELAY_URL: https://tesla-stock-es.clementmoreno.workers.dev/report
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a .venv/bin/python monitor.py
